[project]
name = "fraud-detect"
version = "0.1.0"
description = "Cost-sensitive transaction fraud detection on IEEE-CIS with an analyst alert queue"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1", "numpy>=1.26", "pyarrow>=14", "pyyaml>=6", "tabulate>=0.9",
  "scikit-learn>=1.4", "lightgbm>=4.3", "kaggle>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
